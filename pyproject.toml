[project]
name = "zero-to-one"
version = "0.1.0"
description = "V0 experiment harness: $0 → 1 USDC (mock wallet, independent verifier)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
z21 = "tools.__main__:main"
wallet-balance = "tools.wallet_balance:main"
verify-revenue = "tools.verify_revenue:main"
log-experiment = "tools.log_experiment:main"
operator-inject-payment = "tools.operator_inject_payment:main"
publish = "tools.publish:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
