[project]
name = "zero-to-one"
version = "0.1.0"
description = "Autonomous agent: $0 → 1 USDC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
z21 = "tools.__main__:main"
wallet-balance = "tools.wallet_balance:main"
verify-revenue = "tools.verify_revenue:main"
log-experiment = "tools.log_experiment:main"
publish = "tools.publish:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
